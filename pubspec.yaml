name: journal_intelligence
description: Journal Intelligence — iOS native app with iOS 26 Liquid Glass UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # iOS 26 Liquid Glass native UI
  adaptive_platform_ui: ^0.1.6

  # State management
  provider: ^6.1.2

  # HTTP + cookie handling (mirrors web refresh-token-in-cookie pattern)
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # URL launching (browser + phone app)
  url_launcher: ^6.3.0

  #imagepicker
  image_picker: ^1.1.2
 
  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Shared prefs for non-sensitive settings
  shared_preferences: ^2.3.3
  audioplayers: ^6.6.0

  # Date formatting
  intl: ^0.19.0

  # Authentication
  local_auth: ^2.3.0

  # File picker — Day One import + attachments
  file_picker: ^8.1.2

 # PDF export sharing
  share_plus: ^10.0.0
  path_provider: ^2.1.0

  # Markdown rendering (for AI responses)
  flutter_markdown: ^0.7.4
  http_parser: ^4.1.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
