<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="980" rx="40" fill="#0A0A12"/>
  <text x="800" y="88" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="700" font-family="Arial, Helvetica, sans-serif">Product Surface</text>
  <text x="800" y="132" text-anchor="middle" fill="#B8B8C8" font-size="24" font-family="Arial, Helvetica, sans-serif">From daily reflection to evidence-building and high-stakes planning</text>

  <rect x="80" y="188" width="460" height="320" rx="28" fill="#121223" stroke="#2C2C44"/>
  <text x="116" y="242" fill="#8FD0FF" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif">Capture</text>
  <text x="116" y="292" fill="#FFFFFF" font-size="28" font-weight="700" font-family="Arial, Helvetica, sans-serif">
    <tspan x="116" dy="0">Write, voice, SMS,</tspan>
    <tspan x="116" dy="34">import, widget</tspan>
  </text>
  <text x="116" y="380" fill="#C7C7D5" font-size="22" font-family="Arial, Helvetica, sans-serif">
    <tspan x="116" dy="0">Manual entries, native speech capture,</tspan>
    <tspan x="116" dy="34">Day One import, text-based journaling,</tspan>
    <tspan x="116" dy="34">and home-screen shortcuts.</tspan>
  </text>

  <rect x="570" y="188" width="460" height="320" rx="28" fill="#121223" stroke="#2C2C44"/>
  <text x="606" y="242" fill="#9FE6C0" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif">Understand</text>
  <text x="606" y="292" fill="#FFFFFF" font-size="28" font-weight="700" font-family="Arial, Helvetica, sans-serif">
    <tspan x="606" dy="0">Today, Timeline,</tspan>
    <tspan x="606" dy="34">reflections, TTS</tspan>
  </text>
  <text x="606" y="380" fill="#C7C7D5" font-size="22" font-family="Arial, Helvetica, sans-serif">
    <tspan x="606" dy="0">Daily brief, therapist insight,</tspan>
    <tspan x="606" dy="34">tone-based reflections, attached media,</tspan>
    <tspan x="606" dy="34">and spoken summaries.</tspan>
  </text>

  <rect x="1060" y="188" width="460" height="320" rx="28" fill="#121223" stroke="#2C2C44"/>
  <text x="1096" y="242" fill="#E8B1FF" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif">Ask</text>
  <text x="1096" y="292" fill="#FFFFFF" font-size="28" font-weight="700" font-family="Arial, Helvetica, sans-serif">
    <tspan x="1096" dy="0">RAG search and</tspan>
    <tspan x="1096" dy="34">Sage assistant</tspan>
  </text>
  <text x="1096" y="380" fill="#C7C7D5" font-size="22" font-family="Arial, Helvetica, sans-serif">
    <tspan x="1096" dy="0">Ask your own journal questions,</tspan>
    <tspan x="1096" dy="34">save conversations, attach context,</tspan>
    <tspan x="1096" dy="34">and hand off from other flows.</tspan>
  </text>

  <rect x="80" y="556" width="460" height="320" rx="28" fill="#151A13" stroke="#2F8C4F"/>
  <text x="116" y="610" fill="#9FE6C0" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif">Plan</text>
  <text x="116" y="660" fill="#FFFFFF" font-size="28" font-weight="700" font-family="Arial, Helvetica, sans-serif">
    <tspan x="116" dy="0">Exit Plan, Budget,</tspan>
    <tspan x="116" dy="34">War Room</tspan>
  </text>
  <text x="116" y="748" fill="#D1EAD7" font-size="22" font-family="Arial, Helvetica, sans-serif">
    <tspan x="116" dy="0">Phased plans, AI comparisons,</tspan>
    <tspan x="116" dy="34">urgent triage, notes, tasks,</tspan>
    <tspan x="116" dy="34">attachments, exports, and sharing.</tspan>
  </text>

  <rect x="570" y="556" width="460" height="320" rx="28" fill="#191315" stroke="#A34857"/>
  <text x="606" y="610" fill="#FFB2BC" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif">Protect</text>
  <text x="606" y="660" fill="#FFFFFF" font-size="28" font-weight="700" font-family="Arial, Helvetica, sans-serif">
    <tspan x="606" dy="0">Early Warning, Mental</tspan>
    <tspan x="606" dy="34">Health, Resources</tspan>
  </text>
  <text x="606" y="748" fill="#EFCFD4" font-size="22" font-family="Arial, Helvetica, sans-serif">
    <tspan x="606" dy="0">Spike matching, crisis indicators,</tspan>
    <tspan x="606" dy="34">narrative refresh, support resources,</tspan>
    <tspan x="606" dy="34">and danger-aware review flows.</tspan>
  </text>

  <rect x="1060" y="556" width="460" height="320" rx="28" fill="#161924" stroke="#506DD2"/>
  <text x="1096" y="610" fill="#AFC6FF" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif">Build A Record</text>
  <text x="1096" y="660" fill="#FFFFFF" font-size="28" font-weight="700" font-family="Arial, Helvetica, sans-serif">
    <tspan x="1096" dy="0">Detective, Proof Vault,</tspan>
    <tspan x="1096" dy="34">Exports, Story</tspan>
  </text>
  <text x="1096" y="748" fill="#D6DDF7" font-size="22" font-family="Arial, Helvetica, sans-serif">
    <tspan x="1096" dy="0">Evidence logs, research, uploads,</tspan>
    <tspan x="1096" dy="34">vault folders, clinician summaries,</tspan>
    <tspan x="1096" dy="34">and reusable narrative drafts.</tspan>
  </text>
</svg>
