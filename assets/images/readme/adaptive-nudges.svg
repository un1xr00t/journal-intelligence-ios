<svg width="1600" height="820" viewBox="0 0 1600 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="820" rx="40" fill="#09111C"/>
  <text x="800" y="86" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="700" font-family="Arial, Helvetica, sans-serif">Adaptive Notification Nudges</text>
  <text x="800" y="130" text-anchor="middle" fill="#B7D5EE" font-size="24" font-family="Arial, Helvetica, sans-serif">A local-first reminder system that stays grounded in your routine and your journal</text>

  <rect x="96" y="210" width="300" height="190" rx="28" fill="#101B2B" stroke="#2C77D1"/>
  <text x="128" y="266" fill="#8EC5FF" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif">1. Inputs</text>
  <text x="128" y="318" fill="#FFFFFF" font-size="28" font-weight="700" font-family="Arial, Helvetica, sans-serif">Schedules and saved places</text>
  <text x="128" y="356" fill="#CAE1F4" font-size="21" font-family="Arial, Helvetica, sans-serif">Morning check-in</text>
  <text x="128" y="388" fill="#CAE1F4" font-size="21" font-family="Arial, Helvetica, sans-serif">Evening wrap-up</text>
  <text x="128" y="420" fill="#CAE1F4" font-size="21" font-family="Arial, Helvetica, sans-serif">Weekly Wyatt reminder</text>

  <rect x="460" y="210" width="320" height="190" rx="28" fill="#101B2B" stroke="#2C77D1"/>
  <text x="492" y="266" fill="#8EC5FF" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif">2. On-device learning</text>
  <text x="492" y="318" fill="#FFFFFF" font-size="28" font-weight="700" font-family="Arial, Helvetica, sans-serif">Pattern scan of recent entries</text>
  <text x="492" y="356" fill="#CAE1F4" font-size="21" font-family="Arial, Helvetica, sans-serif">Home stress and family language</text>
  <text x="492" y="388" fill="#CAE1F4" font-size="21" font-family="Arial, Helvetica, sans-serif">Work-to-home transition history</text>
  <text x="492" y="420" fill="#CAE1F4" font-size="21" font-family="Arial, Helvetica, sans-serif">Heavier times of day and Wyatt timing</text>

  <rect x="844" y="210" width="292" height="190" rx="28" fill="#101B2B" stroke="#2C77D1"/>
  <text x="876" y="266" fill="#8EC5FF" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif">3. Smart copy</text>
  <text x="876" y="318" fill="#FFFFFF" font-size="28" font-weight="700" font-family="Arial, Helvetica, sans-serif">Explainable prompt rewriting</text>
  <text x="876" y="356" fill="#CAE1F4" font-size="21" font-family="Arial, Helvetica, sans-serif">The app adjusts what the</text>
  <text x="876" y="388" fill="#CAE1F4" font-size="21" font-family="Arial, Helvetica, sans-serif">notification says and shows why.</text>

  <rect x="1200" y="210" width="304" height="190" rx="28" fill="#101B2B" stroke="#2C77D1"/>
  <text x="1232" y="266" fill="#8EC5FF" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif">4. Action</text>
  <text x="1232" y="318" fill="#FFFFFF" font-size="28" font-weight="700" font-family="Arial, Helvetica, sans-serif">Open Write or Sage</text>
  <text x="1232" y="356" fill="#CAE1F4" font-size="21" font-family="Arial, Helvetica, sans-serif">Prefilled journal prompt</text>
  <text x="1232" y="388" fill="#CAE1F4" font-size="21" font-family="Arial, Helvetica, sans-serif">or auto-send Sage handoff</text>

  <path d="M396 304H460" stroke="#6EB8FF" stroke-width="6" stroke-linecap="round"/>
  <path d="M780 304H844" stroke="#6EB8FF" stroke-width="6" stroke-linecap="round"/>
  <path d="M1136 304H1200" stroke="#6EB8FF" stroke-width="6" stroke-linecap="round"/>
  <path d="M442 304L422 290V318L442 304Z" fill="#6EB8FF"/>
  <path d="M826 304L806 290V318L826 304Z" fill="#6EB8FF"/>
  <path d="M1182 304L1162 290V318L1182 304Z" fill="#6EB8FF"/>

  <rect x="162" y="500" width="1276" height="220" rx="30" fill="#0E1826" stroke="#294765"/>
  <text x="212" y="560" fill="#FFFFFF" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">What makes this unusual</text>
  <text x="212" y="612" fill="#CDE0F0" font-size="23" font-family="Arial, Helvetica, sans-serif">These are local iPhone notifications, not a remote push funnel.</text>
  <text x="212" y="648" fill="#CDE0F0" font-size="23" font-family="Arial, Helvetica, sans-serif">Observed geofence events and learned movement context stay on-device for this feature.</text>
  <text x="212" y="684" fill="#CDE0F0" font-size="23" font-family="Arial, Helvetica, sans-serif">The app can explain why a home or work nudge changed instead of asking users to trust a black box.</text>
</svg>
